<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Secure payment</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--soft:#f3f4f1;--line:#e4e6df;--tx:#171a14;--mut:#6b7164;--g:#8aa968;--gd:#4f6f34;--gbg:#eef3e3;--gline:#d3dfbd;--wbg:#fbf3df;--wline:#efdfb4;--wtx:#7a5a12;--rd:#e5533d;--ok:#2f9e5b;--sh:0 1px 2px rgba(20,24,16,.04),0 8px 24px -12px rgba(20,24,16,.12)}
html[data-theme=dark]{--bg:#0f120d;--card:#171b13;--soft:#1e2319;--line:#2a3023;--tx:#eef1e8;--mut:#9aa28f;--g:#8aa968;--gd:#a9c985;--gbg:#1c2415;--gline:#34422a;--wbg:#2a2412;--wline:#4a3f1c;--wtx:#e6c872;--sh:0 8px 24px -12px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font:500 15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;color:var(--tx);min-height:100vh;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:480px;margin:0 auto;padding:0 16px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top)) 0 14px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--gbg);border:1px solid var(--gline);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px;stroke:var(--gd)}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.secure{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:14px}
.secure svg{width:16px;height:16px;stroke:var(--gd)}
.lock{margin-left:auto;color:var(--mut)}
.lock svg{width:22px;height:22px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--mut);font:700 14px inherit;font-family:inherit;padding:8px 14px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--soft);color:var(--tx)}
.seg svg{width:18px;height:18px;vertical-align:-3px;stroke:currentColor}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
main{padding-top:18px;display:grid;gap:14px}
.status{padding:18px;display:flex;gap:16px;align-items:center;background:var(--soft)}
.tm{flex:none}
.segs{display:flex;gap:3px;margin-bottom:6px}
.segs i{width:11px;height:30px;border-radius:4px;background:var(--line);transition:background .3s}
.segs i.on{background:var(--g)}
.time{font-size:44px;font-weight:800;letter-spacing:.02em;line-height:1}
.st{flex:1;min-width:0}
.st b{display:block;font-size:20px;font-weight:800}
.st span{color:var(--mut);font-size:14px;display:flex;gap:6px;align-items:center;margin-top:4px}
.st span svg{width:18px;height:18px;flex:none}
.rf{flex:none;align-self:flex-start;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--gd);cursor:pointer;display:grid;place-items:center}
.rf svg{width:20px;height:20px}
.rf.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.guide{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;border:1px solid var(--gline);background:var(--gbg);color:var(--gd);font:800 16px inherit;font-family:inherit;cursor:pointer;text-align:left}
.guide .pl{width:40px;height:40px;border-radius:50%;background:var(--g);display:grid;place-items:center;flex:none}
.guide .pl svg{width:16px;height:16px;fill:#fff;stroke:none}
.guide .ar{margin-left:auto;display:flex;gap:2px}
.guide .ar svg{width:16px;height:22px;fill:var(--g)}
.steps{display:none;padding:6px 18px 14px;margin-top:-6px}
.steps.open{display:block}
.steps ol{padding-left:0;list-style:none;counter-item:c;display:grid;gap:10px;margin-top:10px}
.steps li{display:flex;gap:12px;align-items:flex-start;color:var(--tx);font-size:14.5px}
.steps li em{font-style:normal;flex:none;width:26px;height:26px;border-radius:8px;background:var(--gbg);border:1px solid var(--gline);color:var(--gd);font-weight:800;display:grid;place-items:center;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px}
.lbl{color:var(--mut);font-size:15px}
.val{font-size:32px;font-weight:800;letter-spacing:.01em;margin-top:14px;overflow-wrap:anywhere}
.val.sm{font-size:24px}
.cp{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 14px;font:700 15px inherit;font-family:inherit;display:inline-flex;align-items:center;gap:8px;cursor:pointer;flex:none}
.cp svg{width:18px;height:18px}
.cp.done{color:var(--ok);border-color:var(--ok)}
.sec{padding:18px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.prov{float:right;font-weight:800;color:var(--mut);letter-spacing:.04em}
.hold{margin-top:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hold small{display:block;color:var(--mut);font-size:14px}
.hold b{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.warn{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--wbg);border:1px solid var(--wline);color:var(--wtx);font-size:15px}
.warn .ic,.mod .ic{width:30px;height:30px;border-radius:9px;background:var(--rd);display:grid;place-items:center;flex:none}
.warn .ic svg,.mod .ic svg{width:18px;height:18px;stroke:#fff}
.hide{display:none!important}
.res{padding:30px 20px;text-align:center}
.res .big{width:72px;height:72px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center}
.res .big svg{width:36px;height:36px;stroke:#fff}
.res.ok .big{background:var(--ok)}
.res.bad .big{background:var(--rd)}
.res h2{font-size:22px;font-weight:800}
.res p{color:var(--mut);margin-top:6px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;background:var(--g);color:#fff;font:800 17px inherit;font-family:inherit;padding:16px;border-radius:16px;cursor:pointer;margin-top:18px}
.ov{position:fixed;inset:0;background:rgba(10,12,8,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.mod{background:var(--card);border-radius:24px;padding:22px;width:100%;max-width:420px;border:1px solid var(--line)}
.mod .hd{display:flex;align-items:center;gap:12px}
.mod .hd .ic{width:40px;height:40px;border-radius:12px}
.mod h3{font-size:24px;font-weight:800}
.mod p{color:var(--mut);margin-top:16px}
.mod .big{font-size:34px;font-weight:800;margin:8px 0 14px}
.mod .t{color:var(--tx)}
.mod .warn{margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#171a14;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30}
.toast.on{opacity:1;transform:translateX(-50%)}
.cardtile+.cardtile{border-top:1px dashed var(--line)}
.skeleton{padding:60px 20px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/></svg></div>
      <div>
        <h1 id="shop">…</h1>
        <div class="secure"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg><span data-i="secure"></span></div>
      </div>
      <div class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 018 0v3"/></svg></div>
    </div>
    <div class="bar">
      <div class="seg" id="langs"><button data-l="uz">UZ</button><button data-l="ru">RU</button><button data-l="en">EN</button></div>
      <div class="seg" id="themes">
        <button data-t="light" aria-label="light"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg></button>
        <button data-t="dark" aria-label="dark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg></button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
<main id="app">
  <div class="skeleton" id="load">…</div>

  <section id="res" class="box res hide"></section>

  <div id="pay" class="hide" style="display:grid;gap:14px">
    <section class="box status">
      <div class="tm"><div class="segs" id="segs"></div><div class="time mono" id="time">--:--</div></div>
      <div class="st"><b id="stt"></b><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><i style="font-style:normal" data-i="left"></i></span></div>
      <button class="rf" id="rf" aria-label="refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 00-14.5-4.5L4 8M4 4v4h4M4 13a8 8 0 0014.5 4.5L20 16M20 20v-4h-4"/></svg></button>
    </section>

    <button class="guide" id="gd" type="button">
      <span class="pl"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
      <span data-i="guide"></span>
      <span class="ar"><svg viewBox="0 0 16 22"><path d="M2 2l12 9-12 9z" opacity=".5"/></svg><svg viewBox="0 0 16 22"><path d="M2 2l12 9-12 9z"/></svg><svg viewBox="0 0 16 22"><path d="M2 2l12 9-12 9z"/></svg><svg viewBox="0 0 16 22"><path d="M2 2l12 9-12 9z" opacity=".5"/></svg></span>
    </button>
    <section class="box steps" id="steps"><ol id="stl"></ol></section>

    <section class="box">
      <div class="sec">
        <div class="row" style="padding:0"><div class="lbl" data-i="amount"></div><button class="cp" data-copy="amount"></button></div>
        <div class="val mono" id="amt"></div>
      </div>
      <div id="cards"></div>
    </section>

    <div class="warn"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg></span><span id="wtx"></span></div>
  </div>
</main>
</div>

<div class="ov hide" id="ov">
  <div class="mod" role="dialog" aria-modal="true">
    <div class="hd"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg></span><h3 data-i="rule"></h3></div>
    <p data-i="only"></p>
    <div class="big mono" id="mamt"></div>
    <div class="t" data-i="exact"></div>
    <div class="warn"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg></span><span data-i="paynet"></span></div>
    <button class="btn" id="okb" type="button">✓ <span data-i="ok"></span></button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var TOKEN=(location.pathname.match(/\/pay\/([a-z0-9]{20})/)||[])[1]||"";
var D={
uz:{secure:"Xavfsiz to'lov",pending:"To'lov kutilmoqda",left:"To'lov uchun qolgan vaqt",guide:"Qadamma-qadam yo'riqnoma",amount:"O'tkazma summasi",card:"Karta raqami",holder:"Qabul qiluvchi",copy:"Nusxa",copied:"Nusxalandi",warn:"Aynan {a} UZS o'tkazing — boshqa summa avtomatik tasdiqlanmaydi",rule:"Muhim qoida",only:"Faqat shu summani o'tkazing",exact:"Summani so'mgacha aniq o'tkazing. Boshqa summa avtomatik tasdiqlanmaydi.",paynet:"Paynet orqali to'lamang",ok:"Tushunarli",paid:"To'lov tasdiqlandi",paidsub:"Rahmat! To'lov muvaffaqiyatli qabul qilindi.",expired:"Vaqt tugadi",expiredsub:"To'lov muddati tugagan. Botga qaytib, yangi to'lov yarating.",cancelled:"To'lov bekor qilingan",cancelledsub:"Botga qaytib, yangi to'lov yarating.",notfound:"To'lov topilmadi",notfoundsub:"Havola noto'g'ri yoki eskirgan.",back:"Telegramga qaytish",notyet:"To'lov hali topilmadi. Birozdan keyin qayta urinib ko'ring.",neterr:"Aloqa xatosi",steps:["Bank ilovasini oching (Humo, Uzcard, Payme, Click va h.k.)","«Kartaga o'tkazma» bo'limini tanlang","Karta raqami va aniq summani kiriting","O'tkazmani tasdiqlang — to'lov avtomatik tasdiqlanadi"]},
ru:{secure:"Безопасная оплата",pending:"Ожидает оплаты",left:"Осталось времени на оплату",guide:"Пошаговая инструкция",amount:"Сумма перевода",card:"Номер карты",holder:"Получатель",copy:"Копировать",copied:"Скопировано",warn:"Переведите ровно {a} UZS — другая сумма не подтвердится автоматически",rule:"Важное правило",only:"Переводите только эту сумму",exact:"Переведите сумму точно до сума. Другая сумма не подтвердится автоматически.",paynet:"Не оплачивайте через Paynet",ok:"Понятно",paid:"Оплата подтверждена",paidsub:"Спасибо! Платёж успешно получен.",expired:"Время истекло",expiredsub:"Срок оплаты истёк. Вернитесь в бота и создайте новый платёж.",cancelled:"Платёж отменён",cancelledsub:"Вернитесь в бота и создайте новый платёж.",notfound:"Платёж не найден",notfoundsub:"Ссылка неверна или устарела.",back:"Вернуться в Telegram",notyet:"Платёж пока не найден. Попробуйте чуть позже.",neterr:"Ошибка связи",steps:["Откройте банковское приложение (Humo, Uzcard, Payme, Click и т.д.)","Выберите перевод на карту","Введите номер карты и точную сумму","Подтвердите перевод — оплата подтвердится автоматически"]},
en:{secure:"Secure payment",pending:"Awaiting payment",left:"Time left to pay",guide:"Step-by-step guide",amount:"Transfer amount",card:"Card number",holder:"Recipient",copy:"Copy",copied:"Copied",warn:"Transfer exactly {a} UZS — any other amount will not be confirmed automatically",rule:"Important rule",only:"Transfer only this amount",exact:"Send the amount exactly, to the last sum. Any other amount will not be confirmed automatically.",paynet:"Do not pay via Paynet",ok:"Got it",paid:"Payment confirmed",paidsub:"Thank you! Your payment has been received.",expired:"Time is up",expiredsub:"The payment window has expired. Go back to the bot and create a new payment.",cancelled:"Payment cancelled",cancelledsub:"Go back to the bot and create a new payment.",notfound:"Payment not found",notfoundsub:"The link is invalid or outdated.",back:"Back to Telegram",notyet:"Payment not found yet. Please try again in a moment.",neterr:"Network error",steps:["Open your banking app (Humo, Uzcard, Payme, Click, etc.)","Choose a card-to-card transfer","Enter the card number and the exact amount","Confirm — the payment is confirmed automatically"]}
};
var $=function(id){return document.getElementById(id)};
var lang="uz",info=null,fetchedAt=0,busy=false,timer=null,poll=null;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function sess(k,v){try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v)}catch(e){return null}}
function t(k){return (D[lang]&&D[lang][k])||D.uz[k]||k}
function fmt(n){return String(Math.round(Number(n)||0)).replace(/\B(?=(\d{3})+(?!\d))/g," ")}
function card4(c){return String(c||"").replace(/\D/g,"").replace(/(\d{4})(?=\d)/g,"$1 ")}
function toast(m){var e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){e.classList.remove("on")},1500)}
function copy(text,btn){
  function ok(){if(btn){var o=btn.innerHTML;btn.classList.add("done");btn.textContent="✓ "+t("copied");setTimeout(function(){btn.classList.remove("done");btn.innerHTML=o},1400)}toast(t("copied"))}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(ok,fb)}else fb();
  function fb(){var a=document.createElement("textarea");a.value=text;a.setAttribute("readonly","");a.style.cssText="position:fixed;opacity:0;top:0";document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}document.body.removeChild(a)}
}
var CP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="3"/><path d="M5 15V6a2 2 0 012-2h9"/></svg>';
function cpBtn(){var b=document.createElement("button");b.className="cp";b.type="button";b.innerHTML=CP+"<span>"+t("copy")+"</span>";return b}

function applyI18n(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(function(n){n.textContent=t(n.dataset.i)});
  document.querySelectorAll("#langs button").forEach(function(b){b.classList.toggle("on",b.dataset.l===lang)});
  var l=$("stl");l.textContent="";
  t("steps").forEach(function(s,i){var li=document.createElement("li"),e=document.createElement("em"),sp=document.createElement("span");e.textContent=i+1;sp.textContent=s;li.appendChild(e);li.appendChild(sp);l.appendChild(li)});
  if(info)render();
}
function setTheme(v){document.documentElement.dataset.theme=v;document.querySelectorAll("#themes button").forEach(function(b){b.classList.toggle("on",b.dataset.t===v)});store("theme",v)}

function left(){if(!info||info.status!=="pending")return 0;return Math.max(0,Math.round(info.left-(Date.now()-fetchedAt)/1000))}
function tick(){
  var s=left(),m=Math.floor(s/60),x=s%60;
  $("time").textContent=(m<10?"0":"")+m+":"+(x<10?"0":"")+x;
  var tot=Math.max(1,info?info.total:1),on=Math.ceil(10*s/tot);
  var sg=$("segs").children;for(var i=0;i<sg.length;i++)sg[i].classList.toggle("on",i<on);
  if(info&&info.status==="pending"&&s<=0&&!busy)load(false);
}
function show(name){["load","res","pay"].forEach(function(id){$(id).classList.toggle("hide",id!==name)})}
function result(kind,title,sub,backUrl){
  var r=$("res");r.className="box res "+(kind==="ok"?"ok":"bad");r.textContent="";
  var big=document.createElement("div");big.className="big";
  big.innerHTML=kind==="ok"?'<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  var h=document.createElement("h2");h.textContent=title;
  var p=document.createElement("p");p.textContent=sub;
  r.appendChild(big);r.appendChild(h);r.appendChild(p);
  if(info&&info.amount&&kind==="ok"){var a=document.createElement("div");a.className="val mono sm";a.textContent=fmt(info.amount)+" UZS";r.appendChild(a)}
  if(backUrl){var b=document.createElement("a");b.className="btn";b.href=backUrl;b.textContent=t("back");r.appendChild(b)}
  show("res");
}
function render(){
  if(!info)return;
  $("shop").textContent=info.title||"";
  document.title=(info.title||"")+" · "+t("secure");
  var back=info.bot?"https://t.me/"+info.bot:"";
  if(info.status==="completed")return result("ok",t("paid"),t("paidsub"),back);
  if(info.status==="expired")return result("bad",t("expired"),t("expiredsub"),back);
  if(info.status==="cancelled")return result("bad",t("cancelled"),t("cancelledsub"),back);
  show("pay");
  $("stt").textContent=t("pending");
  var a=fmt(info.amount);
  $("amt").textContent=a+" UZS";$("mamt").textContent=a+" UZS";
  $("wtx").textContent=t("warn").replace("{a}",a);
  var c=document.querySelector('[data-copy="amount"]');c.innerHTML=CP+"<span>"+t("copy")+"</span>";c.onclick=function(){copy(String(info.amount),c)};
  var box=$("cards");box.textContent="";
  (info.cards||[]).forEach(function(cd){
    var w=document.createElement("div");w.className="sec cardtile";
    var top=document.createElement("div");top.className="lbl";
    var pv=document.createElement("span");pv.className="prov";pv.textContent=cd.provider||"";
    top.textContent=t("card");top.appendChild(pv);
    var num=document.createElement("div");num.className="val sm mono";num.textContent=card4(cd.card_number);
    var cb=cpBtn();cb.style.marginTop="12px";cb.onclick=function(){copy(String(cd.card_number).replace(/\D/g,""),cb)};
    w.appendChild(top);w.appendChild(num);
    if(cd.holder){
      var hd=document.createElement("div");hd.className="hold";
      var l=document.createElement("div"),s=document.createElement("small"),b=document.createElement("b");
      s.textContent=t("holder");b.textContent=cd.holder;l.appendChild(s);l.appendChild(b);
      hd.appendChild(l);hd.appendChild(cb);cb.style.marginTop="0";w.appendChild(hd);
    }else w.appendChild(cb);
    box.appendChild(w);
  });
  if(!sess("rule_"+TOKEN)){$("ov").classList.remove("hide")}
  tick();
}
function api(path,opt){
  return fetch(path,Object.assign({cache:"no-store",credentials:"omit"},opt||{})).then(function(r){return r.json().catch(function(){return{ok:false}}).then(function(j){j._http=r.status;return j})});
}
function load(manual){
  if(!TOKEN){info=null;show("res");result("bad",t("notfound"),t("notfoundsub"));return Promise.resolve()}
  busy=true;if(manual)$("rf").classList.add("spin");
  var req=manual?api("/api/pay/"+TOKEN+"/check",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}):api("/api/pay/"+TOKEN);
  return req.then(function(j){
    if(j._http===404||j.ok===false&&j._http===404){info=null;result("bad",t("notfound"),t("notfoundsub"));stop();return}
    if(j._http===429){if(manual)toast(t("neterr"));return}
    if(!j.ok)return;
    var prev=info&&info.status;info=j;fetchedAt=Date.now();render();
    if(info.status!=="pending")stop();
    else if(manual&&!j.confirmed)toast(t("notyet"));
  }).catch(function(){if(manual)toast(t("neterr"))}).then(function(){busy=false;$("rf").classList.remove("spin")});
}
function stop(){clearInterval(timer);clearInterval(poll);timer=poll=null}
function start(){
  var s=$("segs");for(var i=0;i<10;i++)s.appendChild(document.createElement("i"));
  timer=setInterval(function(){if(info)tick()},1000);
  poll=setInterval(function(){if(!busy&&!document.hidden)load(false)},4000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden&&!busy)load(false)});
}

document.querySelectorAll("#langs button").forEach(function(b){b.onclick=function(){lang=b.dataset.l;store("lang",lang);applyI18n()}});
document.querySelectorAll("#themes button").forEach(function(b){b.onclick=function(){setTheme(b.dataset.t)}});
$("gd").onclick=function(){$("steps").classList.toggle("open")};
$("rf").onclick=function(){if(!busy)load(true)};
$("okb").onclick=function(){sess("rule_"+TOKEN,"1");$("ov").classList.add("hide")};

var sl=store("lang"),nav=(navigator.language||"uz").slice(0,2).toLowerCase();
lang=D[sl]?sl:(D[nav]?nav:"uz");
var th=store("theme");setTheme(th==="dark"||th==="light"?th:(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
applyI18n();start();load(false);
})();
