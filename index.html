<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprunki Drinks Animation — 9:16 Video Ready</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #111318;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Arial Rounded MT Bold', 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  /* Вертикальный контейнер 9:16 для Shorts / Reels / TikTok */
  .stage-wrapper {
    position: relative;
    width: min(100vw, 430px);
    height: min(100vh, 764px);
    aspect-ratio: 9 / 16;
    background: #55ccf2;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 25px 70px rgba(0,0,0,0.65);
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Панель управления (скрывается во время записи видео) */
  .controls {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    gap: 8px;
    z-index: 20;
    transition: opacity 0.3s;
  }
  .controls.hidden { opacity: 0; pointer-events: none; }

  button {
    background: rgba(15, 23, 42, 0.78);
    color: #fff;
    border: 1.5px solid rgba(255,255,255,0.25);
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: transform 0.15s, background 0.2s;
  }
  button:hover { transform: scale(1.05); background: rgba(15, 23, 42, 0.95); }
  button.active { background: #ef4444; border-color: #fca5a5; }
</style>
</head>
<body>

<div class="stage-wrapper" id="wrapper">
  <div class="controls" id="controls">
    <button id="btnAuto" class="active">▶ Авто-сценарий</button>
    <button id="btnSound">🔇 Звук</button>
    <button id="btnRecord">⏺ Запись видео</button>
  </div>
  <canvas id="game" width="540" height="960"></canvas>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;  // 540
const H = canvas.height; // 960

// --- АУДИО СИНТЕЗАТОР (звук трубочки + музыкальный бит без внешних файлов) ---
let audioCtx = null;
let soundEnabled = false;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSlurpAndNote(freq, type = 'triangle') {
  if (!soundEnabled) return;
  initAudio();
  const now = audioCtx.currentTime;

  // Звук втягивания через трубочку (шумовой свип)
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  osc.frequency.exponentialRampToValueAtTime(freq * 1.35, now + 0.14);
  gain.gain.setValueAtTime(0.14, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.23);
}

// --- ДАННЫЕ ПЕРСОНАЖЕЙ И НАПИТКОВ ---
const characters = [
  {
    id: 'amy',
    name: 'Pinky',
    color: '#f9a8d4',
    accent: '#ef4444', // бантик
    eyeColor: '#22c55e',
    type: 'hedgehog_girl',
    note: 523.25, // C5
    wave: 'sine',
    slotX: 112, slotY: 735,
    x: 112, y: 735,
    placedCup: -1,
    drinkPhase: 0
  },
  {
    id: 'sonic',
    name: 'Speedy',
    color: '#1d4ed8',
    accent: '#fde68a',
    eyeColor: '#111827',
    type: 'hedgehog_boy',
    note: 392.00, // G4
    wave: 'triangle',
    slotX: 224, slotY: 735,
    x: 224, y: 735,
    placedCup: -1,
    drinkPhase: 0
  },
  {
    id: 'pumpkin',
    name: 'Pumpky',
    color: '#ea580c',
    accent: '#15803d',
    eyeColor: '#111827',
    type: 'pumpkin',
    note: 261.63, // C4
    wave: 'sawtooth',
    slotX: 336, slotY: 735,
    x: 336, y: 735,
    placedCup: -1,
    drinkPhase: 0
  },
  {
    id: 'bunny',
    name: 'Mochi',
    color: '#ffffff',
    accent: '#fbcfe8',
    eyeColor: '#111827',
    type: 'bunny',
    note: 659.25, // E5
    wave: 'sine',
    slotX: 448, slotY: 735,
    x: 448, y: 735,
    placedCup: -1,
    drinkPhase: 0
  }
];

const cups = [
  { id: 0, brand: 'Cola',   bg: '#dc2626', lid: '#b91c1c', stripe: '#ffffff', x: 88,  y: 575, occupant: null },
  { id: 1, brand: 'Pepsi',  bg: '#1d4ed8', lid: '#1e40af', stripe: '#ef4444', x: 208, y: 575, occupant: null },
  { id: 2, brand: 'Fanta',  bg: '#f97316', lid: '#ea580c', stripe: '#fde047', x: 328, y: 575, occupant: null },
  { id: 3, brand: 'Coffee', bg: '#e7d5c0', lid: '#451a03', stripe: '#78350f', x: 448, y: 575, occupant: null }
];

// --- ВИРТУАЛЬНЫЙ КУРСОР (ДЛЯ АВТО-СЦЕНАРИЯ ВИДЕО) ---
let autoMode = true;
const cursor = { x: 140, y: 360, clicking: false, draggingChar: null };

// Сценарий действий (как в ролике: по очереди сажаем персонажей в стаканы)
const scriptSteps = [
  { time: 0.6,  action: 'move', x: 112, y: 735 },
  { time: 1.2,  action: 'grab', charIdx: 0 },
  { time: 2.0,  action: 'move', x: 208, y: 515 },
  { time: 2.4,  action: 'drop', cupIdx: 1 }, // Розовый в Pepsi

  { time: 3.2,  action: 'move', x: 224, y: 735 },
  { time: 3.7,  action: 'grab', charIdx: 1 },
  { time: 4.5,  action: 'move', x: 88,  y: 515 },
  { time: 4.9,  action: 'drop', cupIdx: 0 }, // Синий в Cola

  { time: 5.8,  action: 'move', x: 336, y: 735 },
  { time: 6.3,  action: 'grab', charIdx: 2 },
  { time: 7.1,  action: 'move', x: 328, y: 515 },
  { time: 7.5,  action: 'drop', cupIdx: 2 }, // Тыква в Fanta

  { time: 8.4,  action: 'move', x: 448, y: 735 },
  { time: 8.9,  action: 'grab', charIdx: 3 },
  { time: 9.7,  action: 'move', x: 448, y: 515 },
  { time: 10.1, action: 'drop', cupIdx: 3 }, // Зайчик в Coffee

  { time: 11.2, action: 'move', x: 270, y: 320 }, // Курсор отходит в сторону, все 4 пьют!
  { time: 16.0, action: 'reset' }
];

let scriptStartTime = performance.now();
let lastStepIndex = -1;

// --- ОТРИСОВКА ФОНА (НЕБО, ОБЛАКО, ЗЕЛЁНЫЙ ХОЛМ) ---
function drawBackground(t) {
  // Небо
  const skyGrad = ctx.createLinearGradient(0, 0, 0, 360);
  skyGrad.addColorStop(0, '#4bc5f2');
  skyGrad.addColorStop(1, '#7dd8f8');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, 380);

  // Плывущее облако
  const cloudX = 95 + Math.sin(t * 0.35) * 18;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(cloudX, 118, 22, 0, Math.PI * 2);
  ctx.arc(cloudX + 24, 110, 28, 0, Math.PI * 2);
  ctx.arc(cloudX + 54, 114, 24, 0, Math.PI * 2);
  ctx.arc(cloudX + 76, 122, 18, 0, Math.PI * 2);
  ctx.fill();

  // Дальний тёмно-зелёный кустарник / холм с зубчиками травы
  ctx.fillStyle = '#248f0c';
  ctx.beginPath();
  ctx.moveTo(0, 315);
  for (let x = 0; x <= W; x += 14) {
    const hill = Math.sin(x * 0.008) * 32 + Math.cos(x * 0.017) * 14;
    const tuft = (x % 28 === 0) ? -7 : 0;
    ctx.lineTo(x, 295 - hill + tuft);
  }
  ctx.lineTo(W, 560);
  ctx.lineTo(0, 560);
  ctx.closePath();
  ctx.fill();

  // Передняя яркая лужайка
  const grassGrad = ctx.createLinearGradient(0, 520, 0, H);
  grassGrad.addColorStop(0, '#45b814');
  grassGrad.addColorStop(1, '#3da810');
  ctx.fillStyle = grassGrad;
  ctx.fillRect(0, 520, W, H - 520);

  // Декоративные овальные пятна на траве
  ctx.fillStyle = 'rgba(26, 115, 8, 0.35)';
  ctx.beginPath(); ctx.ellipse(95, 860, 62, 16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(455, 895, 70, 18, 0, 0, Math.PI * 2); ctx.fill();
}

// --- ОТРИСОВКА ПЕРСОНАЖЕЙ ---
function drawCharacter(char, cx, cy, scale = 1, isDrinking = false, t = 0) {
  ctx.save();
  ctx.translate(cx, cy);

  // Анимация покачивания в такт музыке, когда пьёт
  const bounceY = isDrinking ? Math.abs(Math.sin(t * 7 + char.note)) * -9 : 0;
  const tilt = isDrinking ? Math.sin(t * 5 + char.note) * 0.06 : 0;
  ctx.translate(0, bounceY);
  ctx.rotate(tilt);
  ctx.scale(scale, scale);

  ctx.lineWidth = 2.6;
  ctx.strokeStyle = '#111827';

  if (char.type === 'hedgehog_girl' || char.type === 'hedgehog_boy') {
    // Туловище (выглядывает из стакана или кружка)
    ctx.fillStyle = char.color;
    ctx.beginPath();
    ctx.roundRect(-22, 10, 44, 58, 18);
    ctx.fill();
    ctx.stroke();

    // Животик
    ctx.fillStyle = '#fde68a';
    ctx.beginPath();
    ctx.ellipse(0, 34, 13, 18, 0, 0, Math.PI * 2);
    ctx.fill();

    // Иголки сзади
    ctx.fillStyle = char.color;
    ctx.beginPath();
    ctx.moveTo(-32, -8);
    ctx.lineTo(-48, 8);
    ctx.lineTo(-34, 16);
    ctx.lineTo(-44, 32);
    ctx.lineTo(-24, 28);
    ctx.moveTo(32, -8);
    ctx.lineTo(48, 8);
    ctx.lineTo(34, 16);
    ctx.lineTo(44, 32);
    ctx.lineTo(24, 28);
    ctx.fill();
    ctx.stroke();

    // Голова
    ctx.fillStyle = char.color;
    ctx.beginPath();
    ctx.arc(0, -14, 34, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Ушки
    [-22, 22].forEach((ex, idx) => {
      ctx.beginPath();
      ctx.moveTo(ex - 8, -36);
      ctx.lineTo(ex + (idx === 0 ? -6 : 6), -54);
      ctx.lineTo(ex + 10, -34);
      ctx.closePath();
      ctx.fillStyle = char.color;
      ctx.fill();
      ctx.stroke();
    });

    // Бантик для розового персонажа
    if (char.type === 'hedgehog_girl') {
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.ellipse(16, -42, 8, 5, -0.3, 0, Math.PI * 2);
      ctx.ellipse(27, -38, 8, 5, 0.3, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(21, -40, 3.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }

    // Мордочка (бежевая маска вокруг глаз и рта)
    ctx.fillStyle = '#fef3c7';
    ctx.beginPath();
    ctx.ellipse(-11, -15, 11, 14, -0.15, 0, Math.PI * 2);
    ctx.ellipse(11, -15, 11, 14, 0.15, 0, Math.PI * 2);
    ctx.ellipse(0, -1, 18, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Глаза
    [-10, 10].forEach(eyeX => {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(eyeX, -16, 7.5, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = char.eyeColor;
      ctx.beginPath(); ctx.arc(eyeX + (isDrinking ? 2 : 0), -15, 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111827';
      ctx.beginPath(); ctx.arc(eyeX + (isDrinking ? 2 : 0), -15, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(eyeX - 1.5, -18, 1.8, 0, Math.PI * 2); ctx.fill();
    });

    // Носик
    ctx.fillStyle = '#111827';
    ctx.beginPath(); ctx.ellipse(0, -5, 4, 2.8, 0, 0, Math.PI * 2); ctx.fill();

    // Рот (вытянут трубочкой если пьёт, или улыбка)
    ctx.beginPath();
    if (isDrinking) {
      ctx.fillStyle = '#fb7185';
      ctx.arc(6, 3, 4.5, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    } else {
      ctx.arc(0, 1, 7, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    }
  } else if (char.type === 'pumpkin') {
    // Тыква
    ctx.fillStyle = '#15803d';
    ctx.fillRect(-5, -46, 10, 14);
    ctx.strokeRect(-5, -46, 10, 14);

    ctx.fillStyle = '#f97316';
    ctx.beginPath(); ctx.ellipse(0, -4, 38, 33, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -4, 22, 33, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -4, 9, 33, 0, 0, Math.PI * 2); ctx.stroke();

    // Глаза и улыбка
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(-13, -10, 6, Math.PI, 0); ctx.stroke();
    ctx.beginPath(); ctx.arc(13, -10, 6, Math.PI, 0); ctx.stroke();
    if (isDrinking) {
      ctx.fillStyle = '#7c2d12';
      ctx.beginPath(); ctx.arc(8, 6, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(0, 4, 12, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    }
  } else if (char.type === 'bunny') {
    // Белый милый зайчик
    ctx.fillStyle = '#ffffff';
    // Ушки
    ctx.beginPath(); ctx.roundRect(-20, -54, 13, 30, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(7, -54, 13, 30, 7); ctx.fill(); ctx.stroke();
    // Голова и тело
    ctx.beginPath(); ctx.ellipse(0, -4, 34, 30, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    // Глазки-дуги
    ctx.beginPath(); ctx.arc(-12, -10, 5.5, Math.PI, 0); ctx.stroke();
    ctx.beginPath(); ctx.arc(12, -10, 5.5, Math.PI, 0); ctx.stroke();
    // Щёчки
    ctx.fillStyle = '#fbcfe8';
    ctx.beginPath(); ctx.ellipse(-19, -2, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(19, -2, 5, 3, 0, 0, Math.PI * 2); ctx.fill();

    if (isDrinking) {
      ctx.fillStyle = '#fb7185';
      ctx.beginPath(); ctx.arc(8, 5, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(0, 2, 6, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    }
  }

  ctx.restore();
}

// --- ОТРИСОВКА СТАКАНА С НАПИТКОМ ---
function drawCup(cup, t) {
  ctx.save();
  ctx.translate(cup.x, cup.y);

  // Тень под стаканом
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0, 78, 42, 10, 0, 0, Math.PI * 2); ctx.fill();

  // Если в стакане сидит персонаж — рисуем его перед трубочкой и крышкой
  if (cup.occupant !== null) {
    const char = characters[cup.occupant];
    drawCharacter(char, 0, -68, 0.92, true, t);
  }

  // Пульсация стакана, когда из него пьют
  const squeeze = cup.occupant !== null ? 1 + Math.sin(t * 14) * 0.025 : 1;
  ctx.scale(squeeze, 2 - squeeze);

  ctx.lineWidth = 2.8;
  ctx.strokeStyle = '#111827';

  // Трубочка (наклоняется ко рту персонажа, если он сидит в стакане!)
  ctx.save();
  ctx.translate(16, -65);
  ctx.rotate(cup.occupant !== null ? -0.35 : 0);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(-4, 15);
  ctx.lineTo(-4, -46);
  ctx.lineTo(-24, -56);
  ctx.lineTo(-21, -63);
  ctx.lineTo(4, -51);
  ctx.lineTo(4, 15);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Капелька / пузырёк напитка, бегущий вверх по трубочке!
  if (cup.occupant !== null) {
    const bubbleY = 10 - ((t * 95) % 58);
    ctx.fillStyle = cup.bg;
    ctx.beginPath();
    ctx.arc(0, bubbleY, 2.8, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // Корпус стакана
  ctx.fillStyle = cup.bg;
  ctx.beginPath();
  ctx.moveTo(-44, -46);
  ctx.lineTo(44, -46);
  ctx.lineTo(33, 72);
  ctx.quadraticCurveTo(0, 80, -33, 72);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Декор брендов на стакане
  if (cup.brand === 'Cola') {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-39, -15);
    ctx.bezierCurveTo(-10, -30, 10, 15, 38, -5);
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'italic bold 17px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('Coca-Cola', 0, 16);
  } else if (cup.brand === 'Pepsi') {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(0, 8, 20, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.arc(0, 8, 18, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#1d4ed8';
    ctx.beginPath(); ctx.arc(0, 8, 18, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 14px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('pepsi', 0, 42);
  } else if (cup.brand === 'Fanta') {
    ctx.fillStyle = '#1d4ed8';
    ctx.beginPath(); ctx.ellipse(0, 12, 28, 20, -0.15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 18px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Fanta', 0, 18);
  } else if (cup.brand === 'Coffee') {
    // Манжет для кофе
    ctx.fillStyle = '#854d0e';
    ctx.beginPath();
    ctx.moveTo(-39, -6); ctx.lineTo(39, -6);
    ctx.lineTo(36, 36); ctx.lineTo(-36, 36);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Кофейное зёрнышко
    ctx.fillStyle = '#451a03';
    ctx.beginPath(); ctx.ellipse(0, 15, 9, 13, 0.3, 0, Math.PI * 2); ctx.fill();
  }

  // Крышка стакана
  ctx.strokeStyle = '#111827';
  ctx.lineWidth = 2.8;
  ctx.fillStyle = cup.lid;
  ctx.beginPath();
  ctx.roundRect(-49, -58, 98, 14, 7);
  ctx.fill(); ctx.stroke();

  ctx.beginPath();
  ctx.roundRect(-41, -68, 82, 12, 6);
  ctx.fill(); ctx.stroke();

  ctx.restore();
}

// --- ОТРИСОВКА КРУЖКОВ-СЛОТОВ ВНИЗУ ---
function drawBottomSlots(t) {
  characters.forEach((char, idx) => {
    // Белый кружок-иконка
    ctx.save();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#111827';
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(char.slotX, char.slotY, 44, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Клип по кругу для портрета в слоте
    ctx.beginPath();
    ctx.arc(char.slotX, char.slotY, 42, 0, Math.PI * 2);
    ctx.clip();

    // Если персонаж ещё в слоте (или слегка затемнён, если уже пьёт)
    if (char.placedCup !== -1 && cursor.draggingChar !== idx) {
      ctx.globalAlpha = 0.38;
    }
    drawCharacter(char, char.slotX, char.slotY + 14, 0.85, false, t);
    ctx.restore();
  });
}

// --- ОТРИСОВКА БЕЛОГО КУРСОРА ---
function drawCursor() {
  ctx.save();
  ctx.translate(cursor.x, cursor.y);
  if (cursor.clicking) ctx.scale(0.88, 0.88);

  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#111827';
  ctx.lineWidth = 2.8;
  ctx.lineJoin = 'round';

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, 34);
  ctx.lineTo(9, 26);
  ctx.lineTo(16, 40);
  ctx.lineTo(22, 37);
  ctx.lineTo(15, 23);
  ctx.lineTo(26, 23);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

// --- ОБНОВЛЕНИЕ АВТО-СЦЕНАРИЯ ---
let targetX = cursor.x, targetY = cursor.y;
let beatTimer = 0;

function updateAutoScript(now) {
  if (!autoMode) return;
  const elapsed = (now - scriptStartTime) / 1000;

  for (let i = 0; i < scriptSteps.length; i++) {
    if (elapsed >= scriptSteps[i].time && lastStepIndex < i) {
      lastStepIndex = i;
      const step = scriptSteps[i];

      if (step.action === 'move') {
        targetX = step.x;
        targetY = step.y;
      } else if (step.action === 'grab') {
        cursor.clicking = true;
        cursor.draggingChar = step.charIdx;
        const c = characters[step.charIdx];
        if (c.placedCup !== -1) {
          cups[c.placedCup].occupant = null;
          c.placedCup = -1;
        }
      } else if (step.action === 'drop') {
        cursor.clicking = false;
        if (cursor.draggingChar !== null) {
          const charIdx = cursor.draggingChar;
          const cup = cups[step.cupIdx];
          cup.occupant = charIdx;
          characters[charIdx].placedCup = step.cupIdx;
          playSlurpAndNote(characters[charIdx].note, characters[charIdx].wave);
          cursor.draggingChar = null;
        }
      } else if (step.action === 'reset') {
        characters.forEach(c => { c.placedCup = -1; c.x = c.slotX; c.y = c.slotY; });
        cups.forEach(cup => { cup.occupant = null; });
        scriptStartTime = now;
        lastStepIndex = -1;
      }
    }
  }

  // Плавное движение курсора
  cursor.x += (targetX - cursor.x) * 0.12;
  cursor.y += (targetY - cursor.y) * 0.12;

  if (cursor.draggingChar !== null) {
    characters[cursor.draggingChar].x = cursor.x;
    characters[cursor.draggingChar].y = cursor.y;
  }
}

// --- ГЛАВНЫЙ ЦИКЛ РЕНДЕРА ---
function loop(now) {
  const t = now / 1000;
  updateAutoScript(now);

  // Периодический звук/такт от персонажей, которые сейчас пьют
  if (now - beatTimer > 650) {
    beatTimer = now;
    cups.forEach(cup => {
      if (cup.occupant !== null) {
        const ch = characters[cup.occupant];
        playSlurpAndNote(ch.note, ch.wave);
      }
    });
  }

  ctx.clearRect(0, 0, W, H);
  drawBackground(t);
  drawBottomSlots(t);

  // Рисуем все 4 стакана (и сидящих в них персонажей)
  cups.forEach(cup => drawCup(cup, t));

  // Если персонаж сейчас перетаскивается курсором — рисуем его поверх
  if (cursor.draggingChar !== null) {
    const ch = characters[cursor.draggingChar];
    drawCharacter(ch, ch.x, ch.y, 1.02, false, t);
  }

  drawCursor();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// --- РУЧНОЕ УПРАВЛЕНИЕ (МЫШЬ ИЛИ ТАЧ) ---
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * (W / rect.width),
    y: (clientY - rect.top) * (H / rect.height)
  };
}

canvas.addEventListener('pointerdown', e => {
  autoMode = false;
  document.getElementById('btnAuto').classList.remove('active');
  const pos = getPos(e);
  cursor.x = pos.x; cursor.y = pos.y; cursor.clicking = true;

  // Проверка нажатия на нижний кружок
  characters.forEach((ch, idx) => {
    if (Math.hypot(pos.x - ch.slotX, pos.y - ch.slotY) < 46) {
      if (ch.placedCup !== -1) { cups[ch.placedCup].occupant = null; ch.placedCup = -1; }
      cursor.draggingChar = idx;
      ch.x = pos.x; ch.y = pos.y;
    }
  });
  // Или клик по стакану, чтобы вынуть персонажа
  cups.forEach(cup => {
    if (cup.occupant !== null && Math.hypot(pos.x - cup.x, pos.y - (cup.y - 40)) < 55) {
      characters[cup.occupant].placedCup = -1;
      cup.occupant = null;
    }
  });
});

canvas.addEventListener('pointermove', e => {
  const pos = getPos(e);
  cursor.x = pos.x; cursor.y = pos.y;
  if (cursor.draggingChar !== null) {
    characters[cursor.draggingChar].x = pos.x;
    characters[cursor.draggingChar].y = pos.y;
  }
});

canvas.addEventListener('pointerup', () => {
  cursor.clicking = false;
  if (cursor.draggingChar !== null) {
    const ch = characters[cursor.draggingChar];
    // Проверяем, отпустили ли над одним из стаканов
    cups.forEach((cup, cupIdx) => {
      if (Math.hypot(ch.x - cup.x, ch.y - (cup.y - 35)) < 65) {
        if (cup.occupant !== null) characters[cup.occupant].placedCup = -1;
        cup.occupant = cursor.draggingChar;
        ch.placedCup = cupIdx;
        playSlurpAndNote(ch.note, ch.wave);
      }
    });
    cursor.draggingChar = null;
  }
});

// --- КНОПКИ УПРАВЛЕНИЯ И ЗАПИСИ ВИДЕО ---
document.getElementById('btnAuto').onclick = function() {
  autoMode = !autoMode;
  this.classList.toggle('active', autoMode);
  if (autoMode) {
    scriptStartTime = performance.now();
    lastStepIndex = -1;
  }
};

document.getElementById('btnSound').onclick = function() {
  soundEnabled = !soundEnabled;
  if (soundEnabled) initAudio();
  this.textContent = soundEnabled ? '🔊 Звук ВКЛ' : '🔇 Звук';
};

let recorder = null, chunks = [];
document.getElementById('btnRecord').onclick = function() {
  const controls = document.getElementById('controls');
  if (!recorder || recorder.state === 'inactive') {
    const stream = canvas.captureStream(60); // 60 FPS прямо с Canvas!
    recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
    chunks = [];
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'drinks_characters_9x16.webm';
      a.click();
      controls.classList.remove('hidden');
      this.textContent = '⏺ Запись видео';
    };
    // Перезапускаем сценарий с 0-й секунды и скрываем кнопки
    scriptStartTime = performance.now();
    lastStepIndex = -1;
    autoMode = true;
    recorder.start();
    this.textContent = '⏹ Стоп';
    setTimeout(() => controls.classList.add('hidden'), 600);
    // Автоматическая остановка записи через 15.5 секунд (полный цикл)
    setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, 15500);
  } else {
    recorder.stop();
  }
};
</script>
